            @media (max-width: 768px) {
                h1 {
                    font-size: 50px; /* スマホ用にフォントサイズを調整 */

            <div class="logo">Menu</div>

            <span class="hamburger-icon">
                <span></span><span></span><span></span>
            </span>
            </button>

        <div class="menu-overlay" id="menuOverlay">

        <main class="food-page">

            <section class="food-finder" aria-label="売店を探す">

                    <span class="sr-only">料理名や部活動名で検索</span>
                    <input id="foodSearch" type="search" placeholder="料理名・部活動名で検索">

                </label>

                <div class="food-tabs" role="tablist" aria-label="売店の種類">
                    <button class="food-tab" type="button" data-tab="food" role="tab" aria-selected="false">屋台</button>
                    <button class="food-tab is-active" type="button" data-tab="club" role="tab" aria-selected="true">部活</button>
                </div>

                <div class="food-filters" id="foodFilters"></div>
            </section>

            <p class="food-count" id="foodCount"></p>
            <section class="food-list" id="foodList" aria-live="polite"></section>

        </footer>


        <script>
            const menuBtn = document.getElementById('menuBtn');
            const menuOverlay = document.getElementById('menuOverlay');
            const siteHeader = document.getElementById('siteHeader');

            function toggleMenu() {
                const isOpen = menuOverlay.classList.toggle('is-open');
                siteHeader.classList.toggle('is-open', isOpen);
                menuBtn.setAttribute('aria-expanded', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }

            menuBtn.addEventListener('click', toggleMenu);

            // メニュー項目をクリックしたら閉じる
            document.querySelectorAll('.menu-list a').forEach((link) => {
                link.addEventListener('click', () => {
                if (menuOverlay.classList.contains('is-open')) toggleMenu();
                });
            });
        </script>
        <script src="scripts/food.js"></script>
    </body>
