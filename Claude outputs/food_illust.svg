<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Backgrounds -->
  <rect x="0"   y="0"   width="200" height="200" fill="#FFF3E0"/>
  <rect x="200" y="0"   width="200" height="200" fill="#FCE4EC"/>
  <rect x="0"   y="200" width="200" height="200" fill="#FFFDE7"/>
  <rect x="200" y="200" width="200" height="200" fill="#E3F2FD"/>

  <!-- Grid lines -->
  <line x1="200" y1="0"   x2="200" y2="400" stroke="#D8CEC4" stroke-width="2"/>
  <line x1="0"   y1="200" x2="400" y2="200" stroke="#D8CEC4" stroke-width="2"/>

  <!-- ===== 唐揚げ (top-left) ===== -->
  <!-- shadow -->
  <ellipse cx="102" cy="126" rx="52" ry="10" fill="#E8C89A" opacity="0.4"/>
  <!-- piece 3 back -->
  <ellipse cx="115" cy="110" rx="24" ry="20" fill="#B8702A" transform="rotate(15 115 110)"/>
  <ellipse cx="115" cy="110" rx="16" ry="13" fill="#CC8038" transform="rotate(15 115 110)"/>
  <!-- bump marks on piece 3 -->
  <circle cx="109" cy="104" r="5" fill="#B8702A"/>
  <circle cx="119" cy="106" r="4" fill="#AA6824"/>
  <circle cx="113" cy="116" r="4" fill="#B8702A"/>

  <!-- piece 2 -->
  <ellipse cx="82" cy="112" rx="22" ry="19" fill="#C07838" transform="rotate(-10 82 112)"/>
  <ellipse cx="82" cy="112" rx="14" ry="12" fill="#D4884A" transform="rotate(-10 82 112)"/>
  <circle cx="76"  cy="106" r="4" fill="#B07030"/>
  <circle cx="86"  cy="104" r="5" fill="#B87030"/>
  <circle cx="80"  cy="118" r="4" fill="#B07030"/>

  <!-- piece 1 main -->
  <ellipse cx="98" cy="88" rx="30" ry="25" fill="#C87840" transform="rotate(-8 98 88)"/>
  <ellipse cx="98" cy="88" rx="21" ry="17" fill="#DC9050" transform="rotate(-8 98 88)"/>
  <!-- bumps -->
  <circle cx="88"  cy="80" r="6" fill="#C07038"/>
  <circle cx="100" cy="78" r="7" fill="#B86A30"/>
  <circle cx="108" cy="84" r="5" fill="#C07038"/>
  <circle cx="90"  cy="94" r="5" fill="#B86A30"/>
  <circle cx="104" cy="96" r="6" fill="#C07038"/>

  <!-- label -->
  <text x="100" y="192" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13" fill="#B09070">唐揚げ</text>

  <!-- ===== フランクフルト (top-right) ===== -->
  <!-- shadow -->
  <ellipse cx="300" cy="155" rx="20" ry="6" fill="#ECC0C0" opacity="0.4"/>
  <!-- stick -->
  <line x1="306" y1="150" x2="290" y2="52" stroke="#C8A050" stroke-width="8" stroke-linecap="round"/>
  <line x1="304" y1="148" x2="289" y2="55" stroke="#DCBA6A" stroke-width="4" stroke-linecap="round"/>

  <!-- sausage body: rotated -18deg around center 298,110 -->
  <g transform="rotate(-18 298 110)">
    <!-- main body -->
    <rect x="280" y="72" width="36" height="76" rx="18" fill="#CC3C28"/>
    <!-- highlight -->
    <rect x="283" y="78" width="12" height="60" rx="6" fill="#E05040" opacity="0.6"/>
    <!-- grill marks -->
    <line x1="280" y1="96"  x2="316" y2="96"  stroke="#8C1C10" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="110" x2="316" y2="110" stroke="#8C1C10" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="124" x2="316" y2="124" stroke="#8C1C10" stroke-width="2.5" stroke-linecap="round"/>
    <!-- end caps -->
    <ellipse cx="298" cy="72"  rx="18" ry="7" fill="#AA3020"/>
    <ellipse cx="298" cy="148" rx="18" ry="7" fill="#AA3020"/>
  </g>

  <!-- label -->
  <text x="300" y="192" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#C08090">フランクフルト</text>

  <!-- ===== ベビーカステラ (bottom-left) ===== -->
  <!-- shadow -->
  <ellipse cx="98" cy="336" rx="54" ry="9" fill="#E0C880" opacity="0.35"/>
  <!-- balls -->
  <circle cx="72"  cy="310" r="21" fill="#CC8840"/>
  <circle cx="72"  cy="310" r="14" fill="#E09C50"/>
  <circle cx="112" cy="304" r="23" fill="#C4803A"/>
  <circle cx="112" cy="304" r="15" fill="#D89048"/>
  <circle cx="94"  cy="330" r="22" fill="#C88440"/>
  <circle cx="94"  cy="330" r="14" fill="#DC9448"/>
  <circle cx="56"  cy="328" r="17" fill="#C07C38"/>
  <circle cx="56"  cy="328" r="11" fill="#D08844"/>
  <circle cx="128" cy="326" r="18" fill="#C07C38"/>
  <circle cx="128" cy="326" r="12" fill="#D08844"/>
  <!-- shine dots -->
  <circle cx="66"  cy="305" r="4" fill="white" opacity="0.5"/>
  <circle cx="105" cy="298" r="4" fill="white" opacity="0.5"/>
  <circle cx="88"  cy="324" r="3" fill="white" opacity="0.5"/>

  <!-- label -->
  <text x="100" y="388" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#B0944A">ベビーカステラ</text>

  <!-- ===== かき氷 (bottom-right) ===== -->
  <!-- bowl -->
  <ellipse cx="300" cy="362" rx="50" ry="13" fill="#98C8E8"/>
  <rect    x="250" y="350" width="100" height="16" rx="6" fill="#A8D4F0"/>
  <!-- ice mound -->
  <path d="M252,353 Q268,318 300,248 Q332,318 348,353 Z" fill="white"/>
  <path d="M252,353 Q268,318 300,248 Q332,318 348,353 Z" fill="none" stroke="#C8E4F4" stroke-width="1.5"/>
  <!-- strawberry syrup -->
  <path d="M287,260 C280,285 270,315 264,353" stroke="#FF70A0" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M310,264 C318,288 322,320 320,353" stroke="#FF70A0" stroke-width="8"  stroke-linecap="round" fill="none" opacity="0.45"/>
  <!-- condensed milk -->
  <path d="M297,260 C296,285 298,320 300,353" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- cherry on top -->
  <circle cx="300" cy="244" r="8" fill="#E83850"/>
  <path d="M300,236 Q308,228 312,222" stroke="#5C9940" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- label -->
  <text x="300" y="392" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13" fill="#7AAABB">かき氷</text>
</svg>
